name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes (GitHub Actions cron supports minimum 5 min intervals)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://vzla-cargo-hub-backend.onrender.com/health")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning::Backend returned $HTTP_STATUS — may be starting up"
            # Try once more after waiting
            sleep 10
            HTTP_STATUS2=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "https://vzla-cargo-hub-backend.onrender.com/health")
            echo "Retry status: $HTTP_STATUS2"
          fi
